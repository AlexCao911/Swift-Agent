[package]
name = "local_ios_agent_runtime"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "local_ios_agent_runtime"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
default = []
builtin-openai-compatible = []
link-mock-local-inference = []
legacy-v1-local-inference-compat = []
link-llama-cpp-local-inference = []
link-llama-cpp-mtmd-local-inference = ["link-llama-cpp-local-inference"]
link-litert-local-inference = []

[dependencies]
getrandom = "0.4.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.10"
